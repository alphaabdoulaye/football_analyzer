<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Live Analyzer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #3b82f6; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card.confirmed { border-left-color: #22c55e; }
        .card.strong { border-left-color: #eab308; }
        .card.watch { border-left-color: #f97316; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; }
        .league { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .minute { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; }
        .teams { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .score { font-size: 1.3rem; color: #38bdf8; font-weight: bold; margin-bottom: 10px; }
        .confidence { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
        .decision { background: #0f172a; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; color: #38bdf8; margin-bottom: 10px; }
        .signals { list-style: none; padding-left: 0; margin: 0; font-size: 0.85rem; color: #cbd5e1; }
        .signals li { margin-bottom: 4px; display: flex; align-items: center; }
        .signals li::before { content: "•"; color: #38bdf8; font-weight: bold; display: inline-block; width: 1em; }
    </style>
</head>
<body>
    <h1>Football Live Analyzer</h1>
    {% for match in results %}
    <div class="card {% if match.score_confiance >= 80 %}confirmed{% elif match.score_confiance >= 60 %}strong{% elif match.score_confiance >= 40 %}watch{% endif %}">
        <div class="header-row">
            <span class="league">{{ match.league }}</span>
            <span class="minute">{{ match.minute }}'</span>
        </div>
        <div class="teams">{{ match.teams }}</div>
        <div class="score">Score : {{ match.score }}</div>
        <div class="confidence">Indice de confiance : {{ match.score_confiance }}%</div>
        <div class="decision">{{ match.decision }}</div>
        <ul class="signals">
            {% for signal in match.signaux %}
            <li>{{ signal }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
</body>
</html>
